<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS Nutrition Center - Price Calculator</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173B2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#173B2B;
    --forest-deep:#0E2A1F;
    --mint:#52B788;
    --mint-dark:#2D8659;
    --mint-pale:#E7F5EC;
    --cream:#FAF8F2;
    --card:#FFFFFF;
    --ink:#1D2622;
    --ink-soft:#5C6B63;
    --line:#E1E3DC;
    --gold:#B8862E;
    --gold-pale:#FBF2DF;
    --radius:14px;
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:16px;flex-wrap:wrap;margin-bottom:22px;
    border-bottom:2px solid var(--forest);
    padding-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .seal{
    width:52px;height:52px;border-radius:50%;
    object-fit:cover;background:#000;
    border:2px solid var(--mint);flex-shrink:0;
  }
  .brand h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:24px;
    margin:0;color:var(--forest-deep);letter-spacing:-0.01em;
  }
  .brand p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .meta{font-size:12px;color:var(--ink-soft);text-align:right;}

  .controls{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    margin-bottom:18px;
  }
  .search{
    flex:1;min-width:220px;position:relative;
  }
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:999px;
    border:1.5px solid var(--line);font-size:14px;font-family:'Inter',sans-serif;
    background:var(--card);color:var(--ink);
  }
  .search input:focus{outline:none;border-color:var(--mint-dark);}
  .search::before{
    content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border:2px solid var(--ink-soft);border-radius:50%;
  }
  .search::after{
    content:"";position:absolute;left:24px;top:60%;
    width:7px;height:2px;background:var(--ink-soft);
    transform:rotate(45deg);
  }
  .tier-group{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:999px;border:1px solid var(--line);flex-wrap:wrap;}
  .tier-group button{
    border:none;background:transparent;padding:8px 14px;border-radius:999px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    font-family:'Inter',sans-serif;transition:background .15s,color .15s;
  }
  .tier-group button.active{background:var(--forest);color:#fff;}
  .tier-group button:hover:not(.active){background:var(--mint-pale);color:var(--forest-deep);}

  .table-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:var(--forest);color:#EDF6EF;font-weight:600;
    text-align:right;padding:11px 12px;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  thead th:first-child{text-align:left;}
  thead th.vp-col{color:var(--gold-pale);}
  tbody td{
    padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;
    font-variant-numeric:tabular-nums;
  }
  tbody td:first-child{text-align:left;font-weight:600;color:var(--forest-deep);}
  tbody tr:hover{background:var(--mint-pale);}
  tbody tr.hidden{display:none;}
  .vp-cell{color:var(--gold);font-weight:600;}
  .price-cell{font-weight:600;color:var(--forest-deep);}
  .line-total{font-weight:700;color:var(--mint-dark);}
  .qty-input{
    width:38px;padding:6px 2px;text-align:center;border:none;
    font-size:13px;font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;background:transparent;
  }
  .qty-input:focus{outline:none;}
  .qty-stepper{
    display:inline-flex;align-items:center;border:1.5px solid var(--line);
    border-radius:8px;overflow:hidden;background:var(--card);
  }
  .qty-btn{
    width:26px;height:28px;border:none;background:var(--mint-pale);
    color:var(--forest-deep);font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;line-height:1;user-select:none;
  }
  .qty-btn:hover{background:var(--mint);color:#fff;}
  .qty-btn:active{background:var(--mint-dark);}
  .mrp-cell{color:var(--ink-soft);text-decoration:line-through;font-size:12.5px;}

  .summary{
    position:sticky;bottom:0;margin-top:20px;
    background:var(--forest);color:#fff;border-radius:var(--radius);
    padding:18px 22px;display:flex;justify-content:space-between;
    align-items:center;flex-wrap:wrap;gap:14px;
    box-shadow:0 -4px 18px rgba(0,0,0,.12);
  }
  .summary .items-count{font-size:13px;color:#B9D6C4;}
  .summary .totals{display:flex;gap:28px;flex-wrap:wrap;}
  .stat{text-align:right;}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9FC6AE;margin-bottom:2px;}
  .stat .value{font-family:'Fraunces',serif;font-weight:600;font-size:21px;}
  .stat.vp .value{color:#F0CC85;}
  .stat.mrp .value{color:#C9D9CE;text-decoration:line-through;font-size:16px;font-weight:500;}
  .stat.pay .value{color:#fff;}
  .stat.savings .value{color:#7FD9A8;}
  .clear-btn{
    background:transparent;border:1.5px solid #3E6851;color:#CFE7DA;
    padding:8px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;
    font-family:'Inter',sans-serif;font-weight:600;
  }
  .clear-btn:hover{background:#1E4A35;}
  .no-results{padding:26px;text-align:center;color:var(--ink-soft);font-size:14px;}
  @media(max-width:640px){
    thead th:nth-child(3),tbody td:nth-child(3){display:none;}
    .summary{flex-direction:column;align-items:stretch;}
    .summary .totals{justify-content:space-between;gap:12px;}
  }
</style>
</head>

  {name:"Big Tablet Box", vp:0, mrp:200, p13:200, p25:200, p35:200, p42:200, p50:200}
];

let currentTier = "mrp";
const qty = {};

const tbody = document.getElementById('tbody');
const tierLabels = {mrp:"MRP", p13:"13% price", p25:"25% price", p35:"35% price", p42:"42% price", p50:"50% price"};

function fmt(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

function buildRows(){
  tbody.innerHTML = products.map((p,i) => `
    <tr data-name="${p.name.toLowerCase()}" data-idx="${i}">
      <td>${p.name}</td>
      <td class="vp-cell">${p.vp}</td>
      <td class="mrp-cell">${fmt(p.mrp)}</td>
      <td class="price-cell price-val" data-idx="${i}">${fmt(p[currentTier])}</td>
      <td>
        <div class="qty-stepper">
          <button type="button" class="qty-btn minus" data-idx="${i}">−</button>
          <input type="number" min="0" step="1" value="0" class="qty-input" data-idx="${i}">
          <button type="button" class="qty-btn plus" data-idx="${i}">+</button>
        </div>
      </td>
      <td class="line-total" data-idx="${i}">${fmt(0)}</td>
    </tr>
  `).join('');
}

function updatePriceColumn(){
  document.getElementById('priceHeader').textContent = tierLabels[currentTier];
  document.querySelectorAll('.price-val').forEach(el => {
    const i = el.dataset.idx;
    el.textContent = fmt(products[i][currentTier]);
  });
  recalcAll();
}

function recalcAll(){
  let totalMrp = 0, totalPay = 0, totalVp = 0, count = 0;
  document.querySelectorAll('.qty-input').forEach(input => {
    const i = input.dataset.idx;
    const q = parseInt(input.value) || 0;
    const price = products[i][currentTier];
    const lineTotal = price * q;
    document.querySelector(`.line-total[data-idx="${i}"]`).textContent = fmt(lineTotal);
    if(q > 0){
      totalMrp += products[i].mrp * q;
      totalPay += lineTotal;
      totalVp += products[i].vp * q;
      count += q;
    }
  });
  document.getElementById('totalMrp').textContent = fmt(totalMrp);
  document.getElementById('totalPay').textContent = fmt(totalPay);
  document.getElementById('totalSavings').textContent = fmt(totalMrp - totalPay);
  document.getElementById('totalVp').textContent = totalVp.toFixed(2).replace(/\.00$/,'');
  document.getElementById('itemsCount').textContent = count + (count === 1 ? ' item selected' : ' items selected');
}

buildRows();
recalcAll();

document.getElementById('tierGroup').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#tierGroup button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTier = btn.dataset.tier;
  updatePriceColumn();
});

tbody.addEventListener('input', e => {
  if(e.target.classList.contains('qty-input')) recalcAll();
});

tbody.addEventListener('click', e => {
  const btn = e.target.closest('.qty-btn');
  if(!btn) return;
  const i = btn.dataset.idx;
  const input = tbody.querySelector(`.qty-input[data-idx="${i}"]`);
  let val = parseInt(input.value) || 0;
  if(btn.classList.contains('plus')) val++;
  else val = Math.max(0, val - 1);
  input.value = val;
  recalcAll();
});

document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('#tbody tr').forEach(row => {
    const match = row.dataset.name.includes(q);
    row.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('.qty-input').forEach(input => input.value = 0);
  recalcAll();
});
</script>
